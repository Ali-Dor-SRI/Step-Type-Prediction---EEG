# Full 32-participant config — same settings as screen20.yaml, all 32 participants.
# Used to build the remaining 12 and retrain the 3-class model + ablation on the
# whole cohort. Same modeling config as the 20-run so those checkpoints are
# reused (reduced search budget; full CV n_repeats=10). The 32 = every
# participant with both Stim+Standing recordings.

participants: [P02, P03, P04, P05, P06, P07, P08, P09, P10, P11, P12, P13, P14,
               P15, P16, P17, P18, P19, P21, P22, P23, P24, P25, P27, P28, P29,
               P30, P31, P33, P35, P37, P39]

preprocessing:
  ica:
    fit_resample_sfreq: 256
    fit_max_duration_s: 180
    max_iter: 200

standing:
  max_windows: 50

modeling:
  parallel:
    participants: -8
  cv:
    n_repeats: 10
  feature_selection:
    stability:
      n_subsamples: 30
  search:
    n_iter: 30
    halving:
      max_resources: 400
  xgb:
    n_estimators: 400
