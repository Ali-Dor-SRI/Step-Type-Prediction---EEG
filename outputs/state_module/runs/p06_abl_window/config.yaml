      - 0.8
      learning_rate:
      - 0.01
      - 0.03
      - 0.05
      subsample:
      - 0.6
      - 0.8
      - 1.0
    num_class: 3
  svm:
    param_grid:
      C:
      - 0.1
      - 1.0
      - 10.0
      - 100.0
      gamma:
      - scale
      - auto
      - 0.001
      - 0.01
      - 0.1
      - 1.0
