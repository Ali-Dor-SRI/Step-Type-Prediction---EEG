[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg_steptype"
version = "2.7.0"
description = "Step-type prediction from EEG signals (MSc thesis pipeline)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abrahao Lab" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }

dependencies = [
    "mne>=1.6",
    "pyvista>=0.43",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "braindecode>=0.8",    # CNN EEG standardization utilities
    "pyyaml>=6.0",
    "pyarrow>=14.0",       # parquet for cached feature matrices
    "pyprep>=0.4",         # automated bad-channel detection
    "meegkit>=0.1.9",      # ZapLine line-noise removal
    "python-picard>=0.8",  # Picard ICA solver for MNE
    "mne-icalabel>=0.6",   # ICA component classification
    "autoreject>=0.4",     # local epoch repair/rejection
    "nibabel>=5.0",        # FreeSurfer surface I/O required by source localization
]

[project.optional-dependencies]
lstm = ["tensorflow>=2.13", "scikeras>=0.12"]
cnn = ["tensorflow>=2.13", "scikeras>=0.12"]
eegnet = ["tensorflow>=2.13", "scikeras>=0.12"]
# PyTorch EEGNet port (models/eegnet_torch.py). CPU wheels are enough:
#   pip install -e ".[torch]" --extra-index-url https://download.pytorch.org/whl/cpu
# braindecode (a core dependency) already pulls torch in; this extra states the
# requirement explicitly and is what the Dockerfile and CI install.
torch = ["torch>=2.1"]
riemannian = ["pyriemann>=0.7"]
dev  = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeg_steptype = ["py.typed"]

[tool.ruff]
# Lint the package, its tests and the CLI drivers with ruff's default rules.
# outputs/ holds recorded-result harness scripts that are never edited, and
# scripts/stim_module/ carries pre-existing style debt (mostly E702) outside the
# CI gate; both are excluded rather than rewritten. The report builders
# (scripts/_report_*.py, scripts/state_module/build_report*.py, regen_fig5_uv.py)
# are the same kind of debt — one-shot figure/DOCX emitters written in a
# semicolon-dense style (~380 E702/E701). The state pipeline scripts themselves
# (run_cohort, screen_ablation, facts_01_inventory, gen_overrides,
# smoke_preprocess) stay inside the gate.
extend-exclude = [
    "outputs",
    "scripts/stim_module",
    "scripts/_report_*.py",
    "scripts/state_module/build_report*.py",
    "scripts/state_module/regen_fig5_uv.py",
]

[tool.ruff.lint]
# Pin the rule set instead of inheriting whatever the installed ruff defaults
# to. The dev extra is not version-pinned, and ruff 0.16 widened its defaults
# (RUF100/RUF012 and friends), which failed CI on a tree that lints clean with
# 0.15. These four are ruff historical defaults.
select = ["E4", "E7", "E9", "F"]
